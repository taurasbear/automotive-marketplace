services:
  nginx:
    profiles:
      - "excluded"

  automotive.marketplace.server:
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.automotive-server.rule=Host(`automotive-marketplace-api.taurasbear.me`)"
      - "traefik.http.routers.automotive-server.entrypoints=web"
      - "traefik.http.services.automotive-server.loadbalancer.server.port=8080"

  automotive.marketplace.client:
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.automotive-client.rule=Host(`automotive-marketplace.taurasbear.me`)"
      - "traefik.http.routers.automotive-client.entrypoints=web"
      - "traefik.http.services.automotive-client.loadbalancer.server.port=57263"

  minio:
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.automotive-minio.rule=Host(`automotive-marketplace-minio.taurasbear.me`)"
      - "traefik.http.routers.automotive-minio.entrypoints=web"
      - "traefik.http.services.automotive-minio.loadbalancer.server.port=9000"

      - "traefik.http.routers.automotive-minio-console.rule=Host(`automotive-marketplace-minio-console.taurasbear.me`)"
      - "traefik.http.routers.automotive-minio-console.entrypoints=web"
      - "traefik.http.services.automotive-minio-console.loadbalancer.server.port=9001"

networks:
  proxy:
    external: true
    name: proxy

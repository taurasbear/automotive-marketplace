name: CI/CD Homeserver

on:
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_GITHUB_TOKEN }}

      - name: Build and push Server image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Automotive.Marketplace.Server/Dockerfile
          target: final
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/automotive.marketplace.server:latest
            ghcr.io/${{ github.repository_owner }}/automotive.marketplace.server:${{ github.sha }}

      - name: Build and push Client image
        uses: docker/build-push-action@v4
        with:
          context: ./automotive.marketplace.client
          target: production
          push: true
          build-args: |
            VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/automotive.marketplace.client:latest
            ghcr.io/${{ github.repository_owner }}/automotive.marketplace.client:${{ github.sha }}

  deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH key and config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 << 'SSHKEY'
          ${{ secrets.HOMESERVER_SSH_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CONFIG'
          Host homeserver-tunnel
              HostName ${{ secrets.HOMESERVER_HOST }}
              User ${{ secrets.HOMESERVER_USERNAME }}
              ProxyCommand /bin/sh -c 'TUNNEL_SERVICE_TOKEN_ID=${{ secrets.CF_ACCESS_CLIENT_ID }} TUNNEL_SERVICE_TOKEN_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }} /usr/local/bin/cloudflared --loglevel debug access tcp --hostname %h'
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking no
              ServerAliveInterval 240
          CONFIG

      - name: Copy compose files and deploy script
        run: |
          ssh -vvv homeserver-tunnel "mkdir -p ~/automotive-marketplace"
          scp docker-compose.yml docker-compose.homeserver.yml \
            .github/scripts/deploy.homeserver.sh \
            homeserver-tunnel:~/automotive-marketplace/

      - name: Deploy to homeserver
        run: |
          ssh -vvv homeserver-tunnel "cd ~/automotive-marketplace && chmod +x deploy.homeserver.sh && \
            export POSTGRES_USER='${{ secrets.POSTGRES_USER }}' && \
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' && \
            export POSTGRES_DB='${{ secrets.POSTGRES_DB }}' && \
            export JWT_KEY='${{ secrets.JWT_KEY }}' && \
            export JWT_ISSUER='${{ secrets.JWT_ISSUER }}' && \
            export JWT_AUDIENCE='${{ secrets.JWT_AUDIENCE }}' && \
            export JWT_ACCESSTOKENEXPIRATIONMINUTES='${{ secrets.JWT_ACCESSTOKENEXPIRATIONMINUTES }}' && \
            export JWT_REFRESHTOKENEXPIRATIONDAYS='${{ secrets.JWT_REFRESHTOKENEXPIRATIONDAYS }}' && \
            export VITE_APP_API_URL='${{ secrets.VITE_APP_API_URL }}' && \
            export MINIO_CONSOLE_URL='${{ secrets.MINIO_CONSOLE_URL }}' && \
            export MINIO_BUCKETNAME='${{ secrets.MINIO_BUCKETNAME }}' && \
            export MINIO_PRESIGNEDURLEXPIRATIONHOURS='${{ secrets.MINIO_PRESIGNEDURLEXPIRATIONHOURS }}' && \
            export MINIO_SERVERURL='${{ secrets.MINIO_SERVERURL }}' && \
            export MINIO_ACCESSKEY='${{ secrets.MINIO_ACCESSKEY }}' && \
            export MINIO_SECRETKEY='${{ secrets.MINIO_SECRETKEY }}' && \
            export OPENAI_APIKEY='${{ secrets.OPENAI_APIKEY }}' && \
            export CARDOG_APIKEY='${{ secrets.CARDOG_APIKEY }}' && \
            export DOCKER_GITHUB_TOKEN='${{ secrets.DOCKER_GITHUB_TOKEN }}' && \
            export GITHUB_REPOSITORY_OWNER='${{ github.repository_owner }}' && \
            bash deploy.homeserver.sh"
